[project]
name = "comfy-easy-sensenova-u1"
version = "0.1.0"
description = "ComfyUI nodes for local SenseNova-U1 multimodal inference"
readme = "README_CN.md"
requires-python = ">=3.10,<3.14"
license = { file = "origin/SenseNova-U1/LICENSE" }
dependencies = [
  # ComfyUI 官方直接依赖：transformers、numpy、Pillow。
  # ComfyUI 官方依赖的传递依赖：huggingface-hub、packaging。
  # 原项目约束留档：
  # "transformers>=4.57.1,<4.58",
  # "huggingface-hub>=0.34,<2",
  # "numpy>=1.24,<3",
  # "pillow>=10,<13",
  # "packaging>=23",
  "accelerate>=1,<2",
]

[project.urls]
Repository = "https://github.com/OpenSenseNova/SenseNova-U1"

[tool.comfy]
PublisherId = "eastmoe"
DisplayName = "Comfy-Easy-SenseNova-U1"
Icon = ""
